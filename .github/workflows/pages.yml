name: GitHub Pages

# Baut die statische Website aus den Lesezeichen und veroeffentlicht sie.
on:
  push:
    branches:
      - main
      - arena/8cb2afbb-videothek
    paths:
      - "tools/**"
      - "_Ursprungsdaten/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Vorschaubilder: URLs werden geholt und zwischengespeichert. Schlaegt das
      # fehl (z. B. Blockade durch den Anbieter), wird die Seite trotzdem mit
      # Platzhaltern gebaut - der Deploy darf davon nicht abhaengen.
      - name: Thumbnail-Cache wiederherstellen
        uses: actions/cache@v4
        with:
          path: data/thumbs.json
          key: thumbs-${{ hashFiles('_Ursprungsdaten/*.md') }}
          restore-keys: thumbs-

      - name: Vorschaubilder ermitteln
        continue-on-error: true
        run: python3 tools/thumbnails.py --workers 8 --max-seconds 900

      - name: Website erzeugen
        run: python3 tools/build_site.py

      # Hinweis: Die Seite wird bewusst NICHT ueber configure-pages freigeschaltet.
      # GitHub erlaubt dem Workflow-Token kein Anlegen der Pages-Site; das ist
      # einmalig manuell noetig (Settings -> Pages -> Source: GitHub Actions).
      # Da alle Pfade relativ sind, wird kein base_path benoetigt.

      # Damit der Cache nicht nur im Actions-Cache lebt: geaenderte
      # Thumbnail-URLs zurueckschreiben. Der Push aendert nur data/thumbs.json;
      # dieser Pfad ist bewusst nicht in `on.push.paths` -> keine Endlosschleife.
      - name: Thumbnail-Cache sichern
        run: |
          if [ -n "$(git status --porcelain data/thumbs.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/thumbs.json
            git commit -m "Thumbnail-Cache aktualisieren"
            git push
          else
            echo "Keine Aenderungen am Thumbnail-Cache."
          fi

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
